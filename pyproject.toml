[project]
name = "digalert"
version = "1.1.0"
description = "Smart Permit Intelligence for Coordinated Urban Excavation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-only"}
authors = [
    {name = "Sathwik Naag", email = "sathwiknaag12@gmail.com"},
    {name = "Pranav Reddy", email = "atakulapranav.official@gmail.com"}
]
keywords = ["civictech", "excavation", "permit", "co-dig", "spatial-analysis"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Affero General Public License v3 (AGPLv3)",
    "Operating System :: OS Independent",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_optional = true

[[tool.mypy.overrides]]
module = ["shapely.*", "jose.*", "passlib.*", "dateutil.*", "sqlalchemy.*"]
ignore_missing_imports = true
